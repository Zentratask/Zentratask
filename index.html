        // CALCULAR SALDO RETIRABLE (SOLO GANANCIAS POR TAREAS)
        function getWithdrawableBalance(user) {
            if (!user) return 0;
            if (typeof user.taskBalance === 'number' && !isNaN(user.taskBalance)) {
                return Math.max(0, Math.min(user.balance, user.taskBalance));
            }
            const userDepsTotal = AppState.deposits
                .filter(d => d.userEmail === user.email || d.userId === user.id)
                .reduce((sum, d) => sum + (parseFloat(d.amount) || 0), 0);
            const estimatedTasks = Math.max(0, (parseFloat(user.balance) || 0) - userDepsTotal);
            user.taskBalance = estimatedTasks;
            return estimatedTasks;
        }
        
        // CARGA ASÍNCRONA DE SUPABASE EN SEGUNDO PLANO
        async function loadDataFromSupabase() {
            if (!supabaseClient) return;
            try {
                const { data: profilesData } = await supabaseClient.from('profiles').select('*');
                if (profilesData && profilesData.length > 0) {
                    const localUsers = JSON.parse(localStorage.getItem('zentra_v6_users')) || [];
                    AppState.users = profilesData.map(p => {
                        const existingLocal = localUsers.find(lu => lu.email === p.email);
                        return {
                            id: p.id,
                            userId: p.user_id,
                            name: p.name,
                            email: p.email,
                            password: p.password,
                            role: p.role,
                            balance: parseFloat(p.balance),
                            taskBalance: existingLocal && typeof existingLocal.taskBalance === 'number' ? existingLocal.taskBalance : undefined,
                            vip: p.vip,
                            hasDeposited: p.has_deposited,
                            refCode: p.ref_code,
                            referredBy: p.referred_by,
                            dateJoined: p.date_joined,
                            completedTasksToday: p.completed_tasks_today || [],
                            lastTaskResetDate: p.last_task_reset_date
                        };
                    });
                }
                const { data: depData } = await supabaseClient.from('deposits').select('*');
                if (depData) {
                    AppState.deposits = depData.map(d => ({
                        id: d.id,
                        userId: d.user_id,
                        userName: d.user_name,
                        userEmail: d.user_email,
                        amount: parseFloat(d.amount),
                        network: d.network,
                        receipt: d.receipt_url,
                        date: new Date(d.created_at).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }),
                        status: d.status
                    }));
                }
                if (AppState.currentUser) {
                    const fresh = AppState.users.find(u => u.email === AppState.currentUser.email);
                    if (fresh) {
                        if (typeof fresh.taskBalance !== 'number' && typeof AppState.currentUser.taskBalance === 'number') {
                            fresh.taskBalance = AppState.currentUser.taskBalance;
                        }
                        AppState.currentUser = fresh;
                    }
                }
                render();
            } catch (err) {
                console.error('Error cargando Supabase en segundo plano:', err);
            }
        }
        async function syncUserToSupabase(user) {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('profiles').upsert([
                    {
                        user_id: String(user.id),
                        name: user.name,
                        email: user.email,
                        password: user.password,
                        role: user.role,
                        balance: user.balance,
                        vip: user.vip,
                        has_deposited: user.hasDeposited,
                        ref_code: user.refCode,
                        referred_by: user.referredBy,
                        date_joined: user.dateJoined,
                        completed_tasks_today: user.completedTasksToday,
                        last_task_reset_date: user.lastTaskResetDate
                    }
                ], { onConflict: 'email' });
            } catch (err) {
                console.error('Error sincronizando usuario:', err);
            }
        }

        function toggleLanguage() {

        function persistState() {
            localStorage.setItem('zentra_v6_users', JSON.stringify(AppState.users));
            localStorage.setItem('zentra_v6_deposits', JSON.stringify(AppState.deposits));
            localStorage.setItem('zentra_v6_withdrawals', JSON.stringify(AppState.withdrawals));
            if (AppState.currentUser) {
                localStorage.setItem('zentra_current_user', JSON.stringify(AppState.currentUser));
                const index = AppState.users.findIndex(u => u.id === AppState.currentUser.id);
                if (index !== -1) AppState.users[index] = AppState.currentUser;
                syncUserToSupabase(AppState.currentUser);
            } else {
                localStorage.removeItem('zentra_current_user');
            }
        }

        function calculateVipFromAmount(amount) {
            if (amount >= 106350) return 11;
            if (amount >= 70900)  return 10;
            if (amount >= 47250)  return 9;
            if (amount >= 23625)  return 8;
            if (amount >= 9450)   return 7;
            if (amount >= 3780)   return 6;
            if (amount >= 1260)   return 5;
            if (amount >= 420)    return 4;
            if (amount >= 120)    return 3;
            if (amount >= 30)     return 2;
            if (amount >= 15)     return 1;
            return 0;
        }
        async function handleAuth(e, isRegistering) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;
            if (isRegistering) {
                const name = document.getElementById('auth-name').value.trim();
                let refCodeInput = document.getElementById('auth-refcode') ? document.getElementById('auth-refcode').value.trim() : '';
                
                const savedRef = localStorage.getItem('zentra_pending_ref');
                if (!refCodeInput && savedRef) {
                    refCodeInput = savedRef;
                }
                if (AppState.users.some(u => u.email === email)) {
                    return showToast(AppState.lang === 'es' ? 'El correo ya se encuentra registrado.' : 'Email is already registered.', false);
                }
                
                let validReferrerCode = null;
                if (refCodeInput) {
                    const refUser = AppState.users.find(u => u.refCode === refCodeInput);
                    if (refUser) validReferrerCode = refUser.refCode;
                }
                const newUser = {
                    id: Date.now(), name, email, password, role: 'user', balance: 0.00, taskBalance: 0.00, vip: 0,
                    hasDeposited: false, refCode: 'Z' + Math.floor(100000 + Math.random() * 900000),
                    referredBy: validReferrerCode, dateJoined: new Date().toLocaleDateString(),
                    completedTasksToday: [], lastTaskResetDate: new Date().toDateString()
                };
                AppState.users.push(newUser);
                AppState.currentUser = newUser;
                localStorage.removeItem('zentra_pending_ref');
                await syncUserToSupabase(newUser);
                persistState();
                showToast(AppState.lang === 'es' ? '¡Registro exitoso! Bienvenido.' : 'Registration successful! Welcome.');
            } else {
                const user = AppState.users.find(u => u.email === email && u.password === password);
                if (!user) return showToast(AppState.lang === 'es' ? 'Credenciales incorrectas.' : 'Incorrect credentials.', false);
                
                const today = new Date().toDateString();
                if (user.lastTaskResetDate !== today) {
                    user.completedTasksToday = [];
                    user.lastTaskResetDate = today;
                }
                AppState.currentUser = user;
                persistState();
                showToast(`${AppState.lang === 'es' ? 'Bienvenido' : 'Welcome'}, ${user.name}`);
            }
            switchTab('dashboard');
        }

        function startTaskDownload(appId) {
            const user = AppState.currentUser;
            if (!user.hasDeposited || user.vip === 0) {
                return showToast(AppState.lang === 'es' ? 'Debes recargar USDT para desbloquear las tareas.' : 'Recharge USDT to unlock tasks.', false);
            }
            const currentVipTier = VIP_LEVELS[user.vip];
            if (user.completedTasksToday.length >= currentVipTier.dailyTasks) {
                return showToast(AppState.lang === 'es' ? 'Límite de tareas diarias alcanzado.' : 'Daily task limit reached.', false);
            }
            if (user.completedTasksToday.includes(appId)) {
                return showToast(AppState.lang === 'es' ? 'Esta tarea ya fue realizada hoy.' : 'Task already completed today.', false);
            }
            const appList = VIP_APPS[user.vip] || [];
            const app = appList.find(a => a.id === appId);
            if (!app) return;
            const modal = document.getElementById('sim-modal');
            document.getElementById('sim-app-icon').className = `fa-solid ${app.icon}`;
            document.getElementById('sim-app-title').textContent = app.name;
            document.getElementById('sim-size-badge').textContent = app.size;
            document.getElementById('sim-status-text').textContent = AppState.lang === 'es' ? "Conectando servidor..." : "Connecting server...";
            document.getElementById('sim-progress-bar').style.width = "0%";
            document.getElementById('sim-percent-text').textContent = "0%";
            modal.classList.remove('hidden');
            let progress = 0;
            const timer = setInterval(() => {
                progress += 25;
                document.getElementById('sim-progress-bar').style.width = `${progress}%`;
                document.getElementById('sim-percent-text').textContent = `${progress}%`;
                if (progress === 50) document.getElementById('sim-status-text').textContent = AppState.lang === 'es' ? "Verificando instalación..." : "Verifying installation...";
                if (progress >= 100) {
                    clearInterval(timer);
                    document.getElementById('sim-status-text').textContent = AppState.lang === 'es' ? "¡Tarea completada!" : "Task completed!";
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        const reward = currentVipTier.rewardPerTask;
                        const currentTasksBal = getWithdrawableBalance(user);
                        user.balance += reward;
                        user.taskBalance = currentTasksBal + reward;
                        user.completedTasksToday.push(appId);
                        persistState();
                        showToast(`+$${reward.toFixed(2)} USDT ${AppState.lang === 'es' ? 'añadidos a tu saldo.' : 'added to your balance.'}`);
                        render();
                    }, 400);
                }
            }, 250);
        }
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            AppState.selectedFile = file;
            const reader = new FileReader();
            reader.onload = function(evt) {

        let isSubmittingDeposit = false;
        async function handleDepositSubmit(e) {
            e.preventDefault();
            if (isSubmittingDeposit) return;
            const amount = parseFloat(document.getElementById('deposit-amount').value);
            if (isNaN(amount) || amount < 15) return showToast(t('min_deposit_err'), false);
            if (!AppState.selectedFile) return showToast(AppState.lang === 'es' ? 'Adjunta la foto del comprobante.' : 'Please attach the receipt screenshot.', false);
            
            isSubmittingDeposit = true;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            if (submitBtn) {
                submitBtn.disabled = true;
            }
            try {
                let receiptUrl = '#';
                if (supabaseClient) {
                    try {
                        const fileName = `${Date.now()}_${AppState.selectedFile.name}`;
                        const { error: uploadError } = await supabaseClient.storage.from('captures').upload(fileName, AppState.selectedFile);
                        if (uploadError) {
                            receiptUrl = URL.createObjectURL(AppState.selectedFile);
                        } else {
                            const { data: publicUrlData } = supabaseClient.storage.from('captures').getPublicUrl(fileName);
                            receiptUrl = publicUrlData.publicUrl;
                        }
                        await supabaseClient.from('deposits').insert([{
                            user_id: AppState.currentUser.id, user_name: AppState.currentUser.name,
                            user_email: AppState.currentUser.email, amount: amount, network: AppState.selectedNetwork,
                            receipt_url: receiptUrl, status: 'Completado'
                        }]);
                    } catch (err) {
                        receiptUrl = URL.createObjectURL(AppState.selectedFile);
                    }
                } else {
                    receiptUrl = URL.createObjectURL(AppState.selectedFile);
                }
                
                const currentTasksBal = getWithdrawableBalance(AppState.currentUser);
                const calculatedVip = calculateVipFromAmount(amount);
                if (calculatedVip > AppState.currentUser.vip) AppState.currentUser.vip = calculatedVip;
                AppState.currentUser.hasDeposited = true;
                AppState.currentUser.balance += amount;
                AppState.currentUser.taskBalance = currentTasksBal;
                AppState.deposits.unshift({
                    id: Date.now(), userId: AppState.currentUser.id, userName: AppState.currentUser.name,
                    userEmail: AppState.currentUser.email, amount: amount, network: AppState.selectedNetwork,
                    receipt: receiptUrl, date: new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }), status: 'Completado'
                });
                AppState.selectedFile = null;
                persistState();
                showToast(AppState.lang === 'es' ? '¡Recarga exitosa!' : 'Recharge successful!');
                switchTab('dashboard');
            } finally {
                isSubmittingDeposit = false;
                if (submitBtn) {
                    submitBtn.disabled = false;
                }
            }
        }
        function handleWithdrawSubmit(e) {
            e.preventDefault();
            const currentDay = new Date().getDate();
            if (currentDay !== 5 && currentDay !== 15 && currentDay !== 25) {
                return showToast(AppState.lang === 'es' ? 'Los retiros solo están permitidos los días 5, 15 y 25 del mes.' : 'Withdrawals allowed only on the 5th, 15th, and 25th.', false);
            }
            const address = document.getElementById('withdraw-address').value.trim();
            const amount = parseFloat(document.getElementById('withdraw-amount').value);
            const withdrawableBal = getWithdrawableBalance(AppState.currentUser);
            if (!address) return showToast(AppState.lang === 'es' ? 'Ingresa una dirección válida.' : 'Enter a valid address.', false);
            if (amount < 5) return showToast(t('min_withdraw_err'), false);
            if (amount > withdrawableBal) {
                return showToast(AppState.lang === 'es' ? 'Solo puedes retirar el saldo ganado con tareas.' : 'You can only withdraw earnings from tasks.', false);
            }
            AppState.currentUser.balance = Math.max(0, AppState.currentUser.balance - amount);
            AppState.currentUser.taskBalance = Math.max(0, withdrawableBal - amount);
            AppState.withdrawals.unshift({
                id: Date.now(), userId: AppState.currentUser.id, userName: AppState.currentUser.name,
                userEmail: AppState.currentUser.email, walletAddress: address, amount: amount,
                date: new Date().toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }), status: 'Pendiente'
            });
            persistState();
            showToast(AppState.lang === 'es' ? 'Solicitud de retiro registrada.' : 'Withdrawal submitted.');
            render();
        }
        function adminApproveWithdrawal(withId) {
            const w = AppState.withdrawals.find(x => x.id === withId);
            if (!w || w.status !== 'Pendiente') return;
            w.status = 'Aprobado';
            persistState();
            showToast(AppState.lang === 'es' ? 'Retiro marcado como pagado.' : 'Withdrawal paid.');
            render();
        }
        function adminRejectWithdrawal(withId) {
            const w = AppState.withdrawals.find(x => x.id === withId);
            if (!w || w.status !== 'Pendiente') return;
            w.status = 'Rechazado';
            const user = AppState.users.find(u => u.id === w.userId);
            if (user) {
                const currentTasksBal = getWithdrawableBalance(user);
                user.balance += w.amount;
                user.taskBalance = currentTasksBal + w.amount;
                syncUserToSupabase(user);
            }
            persistState();
            showToast(AppState.lang === 'es' ? 'Retiro rechazado y reembolsado.' : 'Rejected & refunded.');
            render();
        }
        function adminUpdateBalance(userId, action) {
            const input = document.getElementById(`admin-bal-input-${userId}`);
            const val = parseFloat(input.value);
            if (isNaN(val) || val <= 0) return showToast(AppState.lang === 'es' ? 'Monto inválido.' : 'Invalid amount.', false);
            const user = AppState.users.find(u => u.id === userId);
            if (!user) return;
            const currentTasksBal = getWithdrawableBalance(user);
            if (action === 'add') {
                user.balance += val;
                user.taskBalance = currentTasksBal;
            } else {
                user.balance = Math.max(0, user.balance - val);
                user.taskBalance = Math.min(currentTasksBal, user.balance);
            }
            input.value = '';
            persistState();
            render();
        }
        function adminChangeVip(userId, newVip) {
            const user = AppState.users.find(u => u.id === userId);
            if (!user) return;
            user.vip = parseInt(newVip);
            if (user.vip > 0) user.hasDeposited = true;
            persistState();
            render();
        }

        async function eliminarUsuario(userId) {
            const userToDelete = AppState.users.find(u => u.id === userId);
            if (userToDelete && userToDelete.role === 'admin') {
                return showToast("No se puede eliminar al administrador principal.", false);
            }
            if (!confirm("¿Estás seguro de que deseas eliminar este usuario?")) return;
            if (supabaseClient && userToDelete) {
                try {
                    await supabaseClient.from('profiles').delete().eq('email', userToDelete.email);
                } catch (e) {
                    console.error("Error al eliminar en Supabase:", e);
                }
            }
            AppState.users = AppState.users.filter(u => u.id !== userId);
            persistState();
            showToast("Usuario eliminado correctamente.");
            render();
        }

                                            ${isCurrent ? `<span class="bg-indigo-600 text-white text-[9px] font-black px-2.5 py-1 rounded-full uppercase tracking-wider">${t('active_level')}</span>` : ''}

                                        <div class="grid grid-cols-2 gap-2 bg-white p-2.5 rounded-2xl border border-slate-200 text-[11px]">
                                            <div><span class="text-slate-400 block text-[9px]">${t('daily_tasks')}</span><span class="font-bold text-slate-800">${level.dailyTasks} Descargas</span></div>
                                            <div><span class="text-slate-400 block text-[9px]">${t('daily_earnings')}</span><span class="font-black text-emerald-600">+$${dailyEarnings} USDT/día</span></div>

                                        <button onclick="switchTab('wallet')" class="w-full ${isCurrent ? 'bg-slate-200 text-slate-600 cursor-default' : 'bg-indigo-600 hover:bg-indigo-700 text-white'} font-extrabold py-2.5 rounded-2xl text-xs transition">

                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (AppState.currentTab === 'tasks') {
                const effectiveVip = user.vip > 0 ? user.vip : 1;
                const currentVipTier = VIP_LEVELS[effectiveVip];
                const appList = VIP_APPS[effectiveVip] || [];
                main.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h2 class="text-base font-black text-slate-900">${t('tasks_title')} VIP ${effectiveVip}</h2>
                            <span class="text-[10px] font-extrabold bg-indigo-50 text-indigo-600 border border-indigo-200 px-2.5 py-1 rounded-full">${user.completedTasksToday.length}/${currentVipTier.dailyTasks} ${t('completed')}</span>
                        </div>
                        <div class="space-y-2.5">
                            ${appList.map(app => {
                                const isDone = user.completedTasksToday.includes(app.id);
                                return `
                                    <div class="glass-card p-3.5 rounded-2xl border border-slate-200 flex items-center justify-between">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 ${isDone ? 'bg-slate-100 text-slate-400' : 'bg-indigo-50 text-indigo-600'} rounded-2xl flex items-center justify-center font-bold text-base"><i class="fa-solid ${app.icon}"></i></div>
                                            <div><h4 class="text-xs font-black text-slate-800">${app.name}</h4><span class="text-[9px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-semibold">${app.category}</span></div>
                                        </div>
                                        <button onclick="startTaskDownload('${app.id}')" ${isDone?'disabled':''} class="${isDone ? 'bg-slate-100 text-slate-400' : 'bg-indigo-600 hover:bg-indigo-700 text-white'} font-extrabold text-xs px-3.5 py-2 rounded-xl transition">
                                            ${isDone ? t('done') : `+$${currentVipTier.rewardPerTask.toFixed(2)}`}

                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (AppState.currentTab === 'wallet') {
                const sub = AppState.walletSubTab;
                const net = AppState.selectedNetwork;
                const withdrawableBal = getWithdrawableBalance(user);
                main.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex bg-slate-200/80 p-1 rounded-2xl border border-slate-200">
                            <button onclick="AppState.walletSubTab = 'deposit'; render();" class="flex-1 py-2 rounded-xl text-xs font-extrabold transition ${sub==='deposit'?'bg-indigo-600 text-white shadow-sm':'text-slate-600'}">${t('deposit_usdt')}</button>
                            <button onclick="AppState.walletSubTab = 'withdraw'; render();" class="flex-1 py-2 rounded-xl text-xs font-extrabold transition ${sub==='withdraw'?'bg-indigo-600 text-white shadow-sm':'text-slate-600'}">${t('withdraw_bal')}</button>

                        ${sub === 'deposit' ? `
                            <div class="space-y-3 text-xs">
                                <label class="block font-extrabold text-slate-500 uppercase text-[10px]">${t('select_network')}</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="AppState.selectedNetwork = 'BEP20'; render();" class="p-3 border rounded-2xl text-center transition ${net === 'BEP20' ? 'border-indigo-600 bg-indigo-50 text-indigo-700 font-bold' : 'border-slate-200 text-slate-600 bg-white'}">USDT (BEP20)</button>
                                    <button onclick="AppState.selectedNetwork = 'TRC20'; render();" class="p-3 border rounded-2xl text-center transition ${net === 'TRC20' ? 'border-indigo-600 bg-indigo-50 text-indigo-700 font-bold' : 'border-slate-200 text-slate-600 bg-white'}">USDT (TRC20)</button>
                                </div>
                                <div class="glass-card p-4 rounded-3xl border border-slate-200 text-center space-y-2">
                                    <span class="text-[10px] font-extrabold text-slate-500 uppercase block">${t('deposit_addr')}</span>
                                    <div class="bg-white border border-slate-200 p-3 rounded-2xl break-all font-mono font-bold text-indigo-600 text-xs">${OFFICIAL_WALLETS[net]}</div>
                                    <button onclick="navigator.clipboard.writeText('${OFFICIAL_WALLETS[net]}');showToast('Dirección copiada');" class="text-xs font-extrabold text-indigo-600 hover:underline">${t('copy_addr')}</button>
                                </div>
                                <form onsubmit="handleDepositSubmit(event)" class="glass-card p-4 rounded-3xl border border-slate-200 space-y-3">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">${t('amount_deposited')}</label>
                                        <input type="number" id="deposit-amount" min="15" placeholder="Mínimo $15 USDT" required class="w-full bg-white border border-slate-300 rounded-2xl p-3 text-xs text-slate-800 focus:outline-none focus:border-indigo-600">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 mb-1">${t('payment_receipt')}</label>
                                        <input type="file" id="deposit-file" accept="image/*" onchange="handleFileSelect(event)" required class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:bg-indigo-50 file:text-indigo-600 font-medium">
                                    </div>
                                    <div class="text-center">
                                        <img id="receipt-preview" src="#" alt="Comprobante" class="hidden max-h-28 mx-auto rounded-xl border border-slate-200 mt-2">
                                    </div>
                                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-2xl text-xs transition shadow-md shadow-indigo-600/20">${t('recharge')}</button>
                                </form>
                            </div>
                        ` : `
                            <form onsubmit="handleWithdrawSubmit(event)" class="glass-card p-5 rounded-3xl border border-slate-200 space-y-3.5">
                                <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-2xl text-amber-700 text-[11px] font-bold flex items-center gap-2">
                                    <i class="fa-solid fa-calendar-days text-sm"></i>
                                    <span>Los días de retiro permitidos son únicamente los <strong>5, 15 y 25</strong> de cada mes.</span>
                                </div>
                                <div class="bg-indigo-50/80 border border-indigo-200 p-3 rounded-2xl flex justify-between items-center text-xs">
                                    <span class="font-bold text-slate-700">Ganancias por tareas (Retirable):</span>
                                    <span class="font-black text-emerald-600">$${withdrawableBal.toFixed(2)} USDT</span>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Dirección Billetera (TRC20 / BEP20)</label>

                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Monto a Retirar (Disponible: $${withdrawableBal.toFixed(2)})</label>

                                </div>
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 rounded-2xl text-xs transition">${t('withdraw')}</button>
                            </form>
                        `}
                    </div>
                `;
            } else if (AppState.currentTab === 'referral') {
                const refLink = `${window.location.origin}${window.location.pathname}?ref=${user.refCode}`;
                const teamMembers = AppState.users.filter(u => u.referredBy === user.refCode);
                main.innerHTML = `
                    <div class="space-y-4">
                        <div class="glass-card p-5 rounded-3xl border border-slate-200 text-center space-y-3">
                            <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block">${t('your_ref_code')}</span>
                            <div class="text-xl font-black text-indigo-600 tracking-wider bg-white border border-slate-200 p-3 rounded-2xl shadow-sm">${user.refCode}</div>
                            <div class="bg-slate-100 border border-slate-200 p-2.5 rounded-2xl break-all text-[11px] text-slate-600 font-mono">${refLink}</div>
                            <button onclick="navigator.clipboard.writeText('${refLink}');showToast('Enlace copiado');" class="bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition shadow-md shadow-indigo-600/20">${t('copy_link')}</button>

                        <div class="bg-gradient-to-br from-indigo-50 to-indigo-100/80 p-4 rounded-3xl border border-indigo-200 flex items-center justify-between">

                            <div class="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center text-xl shadow-md shadow-indigo-600/30"><i class="fa-solid fa-users"></i></div>
                        </div>

                                <span><i class="fa-solid fa-user-group text-indigo-600 mr-1.5"></i> ${t('invited_users')}</span>
                                <span class="text-[10px] text-indigo-600 font-extrabold">${teamMembers.length}</span>
                            </h4>
                            <div class="space-y-2 text-xs">
                                ${teamMembers.length === 0 ? `<div class="text-center py-6 space-y-1"><i class="fa-solid fa-user-plus text-slate-300 text-2xl"></i><p class="text-[11px] text-slate-400">${t('no_invitees')}</p></div>` : teamMembers.map(member => `
                                    <div class="flex items-center justify-between p-3 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                        <div><span class="font-extrabold text-slate-800 block">${member.name}</span><span class="text-[10px] text-slate-400">${member.email}</span></div>
                                        <div class="text-right">
                                            <span class="text-[10px] font-extrabold bg-amber-500/10 text-amber-600 border border-amber-500/30 px-2.5 py-0.5 rounded-full inline-flex items-center gap-1"><i class="fa-solid fa-crown text-[9px]"></i> VIP ${member.vip}</span>
                                            <span class="block text-[9px] text-slate-400 mt-0.5">Registro: ${member.dateJoined || 'Reciente'}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (AppState.currentTab === 'admin' && user.role === 'admin') {
                const pendingWithdrawals = AppState.withdrawals.filter(w => w.status === 'Pendiente');
                const usersWithReferrerInfo = AppState.users.map(u => {
                    let referrerName = 'Ninguno (Registro directo)';
                    if (u.referredBy) {
                        const sponsor = AppState.users.find(s => s.refCode === u.referredBy);
                        if (sponsor) referrerName = `${sponsor.name} (${sponsor.email}) - Código: ${sponsor.refCode}`;
                    }
                    return { ...u, referrerName };
                });
                main.innerHTML = `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                            <h2 class="text-base font-black text-amber-600"><i class="fa-solid fa-sliders mr-1"></i> Panel Administrador</h2>
                            <span class="text-[10px] bg-amber-500/10 text-amber-600 border border-amber-500/30 px-2 py-0.5 rounded-md font-extrabold">ADMIN</span>
                        </div>
                        <div class="space-y-2">
                            <h3 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Historial de Recargas Online (${AppState.deposits.length})</h3>
                            ${AppState.deposits.length === 0 ? '<p class="text-xs text-slate-400 italic">No hay recargas registradas.</p>' : AppState.deposits.map(dep => `
                                <div class="glass-card p-3.5 rounded-2xl border border-slate-200 space-y-2 text-xs shadow-sm">
                                    <div class="flex justify-between items-start">
                                        <div><span class="font-extrabold text-slate-800 block">${dep.userName}</span><span class="text-[10px] text-slate-500">${dep.userEmail} • Red: ${dep.network} • ${dep.date}</span></div>
                                        <span class="font-black text-emerald-600 text-sm">+$${dep.amount.toFixed(2)} USDT</span>
                                    </div>
                                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                                        <button onclick="openReceiptModal('${dep.receipt}')" class="text-indigo-600 font-extrabold text-[11px] underline"><i class="fa-solid fa-image mr-1"></i> Ver Comprobante Supabase</button>
                                        <div class="flex items-center gap-2">
                                            <button onclick="eliminarCapture(${dep.id})" class="bg-rose-50 text-rose-600 border border-rose-200 px-2 py-1 rounded-xl font-bold text-[10px]">Eliminar</button>
                                            <span class="text-[10px] font-bold bg-emerald-500/10 text-emerald-600 border border-emerald-500/30 px-2.5 py-0.5 rounded-full">Sincronizado Online</span>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="space-y-2">
                            <h3 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Retiros Pendientes (${pendingWithdrawals.length})</h3>
                            ${pendingWithdrawals.length === 0 ? '<p class="text-xs text-slate-400 italic">No hay retiros pendientes.</p>' : pendingWithdrawals.map(w => `
                                <div class="glass-card p-3.5 rounded-2xl border border-slate-200 space-y-2 text-xs shadow-sm">
                                    <div class="flex justify-between items-start">
                                        <div><span class="font-extrabold text-slate-800 block">${w.userName}</span><span class="text-[10px] text-slate-500">${w.userEmail} • ${w.date}</span></div>
                                        <span class="font-black text-rose-500 text-sm">-$${w.amount.toFixed(2)} USDT</span>
                                    </div>
                                    <div class="bg-slate-100 p-2 rounded-xl break-all font-mono text-[10px] text-slate-700"><strong>Dirección de Destino:</strong> ${w.walletAddress}</div>
                                    <div class="flex justify-end gap-2 pt-1">
                                        <button onclick="adminRejectWithdrawal(${w.id})" class="bg-rose-50 text-rose-600 border border-rose-200 px-3 py-1 rounded-xl font-bold text-xs">Rechazar</button>
                                        <button onclick="adminApproveWithdrawal(${w.id})" class="bg-emerald-600 text-white px-3 py-1 rounded-xl font-bold text-xs">Aprobar Pago</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="space-y-2">
                            <h3 class="text-xs font-extrabold text-slate-800 uppercase tracking-wider">Usuarios Registrados (${usersWithReferrerInfo.length})</h3>
                            <div class="space-y-2.5">
                                ${usersWithReferrerInfo.map(u => `
                                    <div class="glass-card p-3.5 rounded-2xl border border-slate-200 space-y-2 text-xs shadow-sm">
                                        <div class="flex justify-between items-center">
                                            <div><span class="font-extrabold text-slate-800 block">${u.name} ${u.role==='admin'?'<span class="text-amber-600 text-[9px]">(Admin)</span>':''}</span><span class="text-[10px] text-slate-500">${u.email}</span></div>
                                            <div class="text-right"><span class="font-black text-emerald-600 block">$${u.balance.toFixed(2)}</span><span class="text-[10px] font-bold text-amber-600">VIP ${u.vip}</span></div>
                                        </div>
                                        <div class="bg-slate-100 p-2 rounded-xl text-[10px] text-slate-600">
                                            <strong>Invitado por:</strong> ${u.referrerName} <br>
                                            <strong>Su Código Personal:</strong> <span class="font-mono font-bold">${u.refCode}</span>
                                        </div>
                                        <div class="flex gap-2 items-center pt-2 border-t border-slate-100">
                                            <input type="number" id="admin-bal-input-${u.id}" placeholder="Monto" class="bg-white border border-slate-300 rounded-xl p-1.5 text-xs text-slate-800 w-24 outline-none">
                                            <button onclick="adminUpdateBalance(${u.id}, 'add')" class="bg-indigo-600 text-white px-2.5 py-1 rounded-xl font-bold text-[11px]">+ Sumar</button>
                                            <button onclick="adminUpdateBalance(${u.id}, 'sub')" class="bg-rose-600 text-white px-2.5 py-1 rounded-xl font-bold text-[11px]">- Restar</button>
                                            ${u.role !== 'admin' ? `<button onclick="eliminarUsuario(${u.id})" class="bg-rose-500 text-white px-2.5 py-1 rounded-xl font-bold text-[11px] ml-auto"><i class="fa-solid fa-trash"></i> Eliminar</button>` : ''}
                                        </div>
                                        <div class="flex items-center gap-2 pt-1">
                                            <span class="text-[10px] text-slate-500 font-bold">Cambiar VIP:</span>
                                            <select onchange="adminChangeVip(${u.id}, this.value)" class="bg-white border border-slate-300 text-slate-800 rounded-xl p-1 text-xs outline-none">
                                                <option value="0" ${u.vip === 0 ? 'selected' : ''}>VIP 0</option>
                                                <option value="1" ${u.vip === 1 ? 'selected' : ''}>VIP 1 (S0)</option>
                                                <option value="2" ${u.vip === 2 ? 'selected' : ''}>VIP 2 (S1)</option>
                                                <option value="3" ${u.vip === 3 ? 'selected' : ''}>VIP 3 (S2)</option>
                                                <option value="4" ${u.vip === 4 ? 'selected' : ''}>VIP 4 (S3)</option>
                                                <option value="5" ${u.vip === 5 ? 'selected' : ''}>VIP 5 (S4)</option>
                                                <option value="6" ${u.vip === 6 ? 'selected' : ''}>VIP 6 (S5)</option>
                                                <option value="7" ${u.vip === 7 ? 'selected' : ''}>VIP 7 (S6)</option>
                                                <option value="8" ${u.vip === 8 ? 'selected' : ''}>VIP 8 (S7)</option>
                                                <option value="9" ${u.vip === 9 ? 'selected' : ''}>VIP 9 (S8)</option>
                                                <option value="10" ${u.vip === 10 ? 'selected' : ''}>VIP 10 (S9)</option>
                                                <option value="11" ${u.vip === 11 ? 'selected' : ''}>VIP 11 (S10)</option>
                                            </select>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        }
        
        // Renderizar inmediatamente la interfaz para evitar la pantalla en blanco
        render();
        // Iniciar la carga de Supabase de forma asíncrona en segundo plano
        loadDataFromSupabase();
    </script>
